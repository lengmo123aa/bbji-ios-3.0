# BB鸡 iOS 3.0 —— XcodeGen 工程描述（CI 里生成 xcodeproj，不提交 xcodeproj）
# 独立 bundle id / 显示名 / 版本，跟 0.0.2（cn.xkmd.bbji.ios）同机共存互不覆盖
name: BBji3
options:
  bundleIdPrefix: cn.xkmd
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    ENABLE_BITCODE: NO
    DEVELOPMENT_TEAM: ""
targets:
  BBji3:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        excludes:
          - "Info.plist"
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: BB鸡 3.0
        CFBundleShortVersionString: "3.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Light
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cn.xkmd.bbji.ios30
        PRODUCT_NAME: BBji3
        INFOPLIST_FILE: Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "3.0.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
schemes:
  BBji3:
    build:
      targets:
        BBji3: all
    run:
      config: Release
    archive:
      config: Release
